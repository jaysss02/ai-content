[project]
name = "content-pipeline"
version = "0.1.0"
description = "Turns a content brief into channel-adapted marketing content with an AI quality check."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.75.0",
    "pydantic>=2.0",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
content-pipeline = "content_pipeline.cli:main"
content-pipeline-web = "content_pipeline.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
content_pipeline = ["templates/*.html"]
